name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Kein GitHub-Token in der Workspace-Git-Config zurücklassen –
          # Install-/Lifecycle-Scripts (native Builds) laufen danach.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the `postinstall` electron-rebuild (which would
      # build better-sqlite3 for Electron's ABI) and other native/download
      # scripts (puppeteer Chromium). CI runs under plain Node, not Electron.
      - name: Install dependencies (skip native/electron postinstall)
        run: npm ci --ignore-scripts

      # Build the one native module the test suite actually uses against the
      # CI Node ABI. keytar/puppeteer are not imported by the test paths.
      - name: Build better-sqlite3 for the Node ABI
        run: npm rebuild better-sqlite3

      # CI=true (set automatically by GitHub Actions) makes vitest.config.ts
      # exclude the Electron-renderer contract tests. Live-API tests skip
      # themselves when ANTHROPIC_API_KEY is absent.
      - name: Run tests
        # TZ is fixed here (real OS env, before Node starts) so timezone-sensitive
        # tests are deterministic. Setting process.env.TZ inside a test file is too
        # late — glibc caches the zone on the first Date use (in setup.ts), so the
        # runner's default (UTC) would otherwise win. See vitest.config.ts (env.TZ)
        # for the matching local fallback.
        env:
          TZ: Europe/Berlin
        run: npx vitest run

  # Eigenständiges Export-Tool mit EIGENEM better-sqlite3 (Node-ABI). Ein
  # separater Job (frischer Checkout, kein Root-node_modules) beweist, dass das
  # Package unabhängig von der Electron-App baut und läuft — ohne ABI-Tanz.
  nanobot-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Kein GitHub-Token in der Workspace-Git-Config zurücklassen –
          # Install-/Lifecycle-Scripts (native Builds) laufen danach.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Baut better-sqlite3 hier für die Node-ABI (kein electron-rebuild-
      # postinstall im Tool-Package). Root wird bewusst NICHT installiert.
      # `npm ci` nutzt das committete package-lock.json (reproduzierbar).
      - name: Install nanobot-export tool
        run: npm --prefix tools/nanobot-export ci

      - name: Test nanobot-export tool
        run: npm --prefix tools/nanobot-export test
